<!doctype html>
<html lang="tr"><head><meta charset="utf-8">
<style>
@font-face{font-family:'Space Grotesk';font-weight:300 700;src:url('../../../site/public/fonts/space-grotesk-latin.woff2') format('woff2');}
@font-face{font-family:'Inter';font-weight:100 900;src:url('../../../site/public/fonts/inter-latin.woff2') format('woff2');}
@font-face{font-family:'JetBrains Mono';font-weight:100 800;src:url('../../../site/public/fonts/jetbrains-mono-latin.woff2') format('woff2');}
:root{--ink:#0a0d14;--lime:#c8f031;--white:#eef1f6;--mute:#8d95aa;--line:#262b38}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:2048px;height:1152px;background:var(--ink);overflow:hidden}
.banner{position:relative;width:2048px;height:1152px;background:
  radial-gradient(900px 500px at 50% 50%,rgba(200,240,49,.07),transparent 70%),var(--ink)}
.grid{position:absolute;inset:0;background-image:
  linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:96px 96px;opacity:.35;
  -webkit-mask-image:radial-gradient(ellipse 60% 70% at 50% 50%,transparent 30%,#000 100%);
  mask-image:radial-gradient(ellipse 60% 70% at 50% 50%,transparent 30%,#000 100%)}
svg.deco{position:absolute;inset:0;width:100%;height:100%}
/* safe area: 1235x338 centred (visible on every device) */
.safe{position:absolute;left:50%;top:50%;width:1235px;height:338px;transform:translate(-50%,-50%);
  display:flex;align-items:center;justify-content:center;gap:56px}
.mark{width:230px;height:264px;flex:none}
.txt{display:flex;flex-direction:column;gap:20px}
.name{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:92px;letter-spacing:.16em;color:var(--white);line-height:1}
.tag{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:64px;letter-spacing:-.035em;line-height:1.02;color:var(--white)}
.tag em{font-style:normal;color:var(--lime)}
.sub{font-family:'JetBrains Mono',monospace;font-size:27px;letter-spacing:.1em;color:var(--mute);text-transform:uppercase;white-space:nowrap}
.sub b{color:var(--lime);font-weight:500}
</style></head>
<body>
<div class="banner">
  <div class="grid"></div>
  <svg class="deco" viewBox="0 0 2048 1152" fill="none" aria-hidden="true">
    <g stroke="#262b38" stroke-width="14" stroke-linejoin="round" stroke-linecap="round">
      <path d="M60 170H300V330H430"/>
      <path d="M1988 980H1760V820H1620"/>
      <path d="M120 1010H330V900"/>
      <path d="M1930 150H1740V270"/>
    </g>
    <g fill="#0a0d14" stroke="#262b38" stroke-width="8">
      <circle cx="300" cy="330" r="18"/><circle cx="1760" cy="820" r="18"/>
    </g>
    <g fill="#c8f031">
      <circle cx="60" cy="170" r="18"/><circle cx="430" cy="330" r="12" opacity=".55"/>
      <circle cx="1988" cy="980" r="18"/><circle cx="1620" cy="820" r="12" opacity=".55"/>
      <circle cx="330" cy="900" r="12" opacity=".55"/><circle cx="1740" cy="270" r="12" opacity=".55"/>
    </g>
  </svg>
  <div class="safe">
    <svg class="mark" viewBox="0 0 400 460" aria-label="SAYNOVRA">
      <path d="M340 62H88V230H312V398H60" fill="none" stroke="#eef1f6" stroke-width="46" stroke-linejoin="round"/>
      <circle cx="88" cy="230" r="36" fill="#0a0d14" stroke="#eef1f6" stroke-width="24"/>
      <circle cx="312" cy="230" r="36" fill="#0a0d14" stroke="#eef1f6" stroke-width="24"/>
      <circle cx="340" cy="62" r="53" fill="#c8f031"/>
      <circle cx="60" cy="398" r="53" fill="#c8f031"/>
    </svg>
    <div class="txt">
      <div class="name">SAYNOVRA</div>
      <div class="tag">Fikirden <em>çalışan</em> sisteme.</div>
      <div class="sub">Yazılım <b>/</b> Yapay zekâ <b>/</b> Otomasyon</div>
    </div>
  </div>
</div>
</body></html>
